<!-- Az AI-asszisztens jele: ház + hajtás. Maszkként használjuk (app.css
     `.aidt-jel`), ezért a szín közömbös — a maszk az alfa-csatornát olvassa,
     és a vonal is, a kitöltés is beleszámít.

     KIS MÉRETRE tervezve (22–30 képpont): a ház KÖRVONAL, a levél TÖMÖR. Vékony
     vonalas levél ekkora méretben szétesne, tömör házsziluett viszont fekete
     folttá válna. A rajzolat kitölti a viewBoxot — a levegőt a körülvevő korong
     adja, nem az ikon belseje. -->
